stages:
  - prepare
  - verify
  - build
  - browser
  - deploy-staging
  - deploy-production

workflow:
  name: 'astro_blog app:$CI_COMMIT_SHORT_SHA content:$CONTENT_SHA'
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

default:
  image: node:24-bookworm
  interruptible: true
  before_script:
    - &node-bootstrap |
      NODE_HOME="$CI_PROJECT_DIR/.ci-tools/node-v${NODE_VERSION}-linux-x64"
      if [[ ! -x "$NODE_HOME/bin/node" ]]; then
        mkdir -p "$CI_PROJECT_DIR/.ci-tools"
        curl --fail --silent --show-error --location \
          "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
          --output "$CI_PROJECT_DIR/.ci-tools/node.tar.xz"
        echo "${NODE_DIST_SHA256}  $CI_PROJECT_DIR/.ci-tools/node.tar.xz" | sha256sum --check
        tar -xJf "$CI_PROJECT_DIR/.ci-tools/node.tar.xz" \
          -C "$CI_PROJECT_DIR/.ci-tools"
      fi
      export PATH="$NODE_HOME/bin:$PATH"
      hash -r
      node --version
      npm --version

variables:
  NODE_VERSION: "24.15.0"
  NODE_DIST_SHA256: "472655581fb851559730c48763e0c9d3bc25975c59d518003fc0849d3e4ba0f6"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  CONTENT_WORKTREE: "$CI_PROJECT_DIR/.work/content-source"
  CONTENT_PACKAGE_NAME: "astro-blog-content"
  RELEASE_PACKAGE_NAME: "astro-blog-release"
  UNIT_EVIDENCE_PACKAGE_NAME: "astro-blog-unit-evidence"
  BROWSER_EVIDENCE_PACKAGE_NAME: "astro-blog-browser-evidence"
  STAGING_EVIDENCE_PACKAGE_NAME: "astro-blog-staging-evidence"
  PRODUCTION_EVIDENCE_PACKAGE_NAME: "astro-blog-production-evidence"

cache:
  &dependency-cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .ci-tools/
    - .cache/ms-playwright/
  policy: pull

prepare-content:
  stage: prepare
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .ci-tools/
      - .cache/ms-playwright/
    policy: pull-push
  script:
    - npm ci
    - bash tools/ci/prepare-content.sh
    - tar -czf .build/content.tar.gz -C .build content content-manifest.json diagnostics evidence/content-head.txt
    - bash tools/ci/package-artifact.sh upload "$CONTENT_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}" .build/content.tar.gz

verify:
  stage: verify
  cache: *dependency-cache
  needs:
    - job: prepare-content
      artifacts: false
  script:
    - npm ci
    - mkdir -p .build
    - bash tools/ci/package-artifact.sh download "$CONTENT_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}" .build/content.tar.gz
    - tar -xzf .build/content.tar.gz -C .build
    - mkdir -p .build/evidence
    - bash tools/ci/npm-audit-with-retry.sh .build/evidence/npm-audit.json
    - npx astro check
    - |
      set +e
      npm run test:unit
      test_status=$?
      set -e
      tar -czf .build/unit-evidence.tar.gz -C .build evidence
      bash tools/ci/package-artifact.sh upload "$UNIT_EVIDENCE_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}-${CI_JOB_ID}" .build/unit-evidence.tar.gz
      exit "$test_status"
    - npm run boundaries:verify
    - npm run paths:verify
    - npm run evidence:privacy
    - npm run comments:verify-removed
    - npm run cloudflare:verify-static
    - npm run cf:types:check
    - npm run openspec:validate
    - npm run openspec:evidence:check

build:
  stage: build
  cache: *dependency-cache
  needs:
    - job: prepare-content
      artifacts: false
    - job: verify
      artifacts: false
  script:
    - npm ci
    - mkdir -p .build
    - bash tools/ci/package-artifact.sh download "$CONTENT_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}" .build/content.tar.gz
    - tar -xzf .build/content.tar.gz -C .build
    - npm run build:prepared
    - npm run routes:verify
    - npm run html-baseline:verify
    - npm run smoke:static
    - npm run assets:verify
    - npm run comments:verify-removed
    - npm run routes:generate
    - npm run assets:generate
    - APP_SHA="$CI_COMMIT_SHA" npm run manifest:build
    - tar -czf .build/release.tar.gz dist .build/manifests .build/content-manifest.json .build/evidence
    - bash tools/ci/package-artifact.sh upload "$RELEASE_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}" .build/release.tar.gz

.browser-base:
  stage: browser
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .ci-tools/
      - .cache/ms-playwright/
    policy: pull-push
  needs:
    - job: build
      artifacts: false
  script:
    - npm ci
    - mkdir -p .build
    - bash tools/ci/package-artifact.sh download "$RELEASE_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}" .build/release.tar.gz
    - tar -xzf .build/release.tar.gz
    - npx playwright install chromium
    - |
      set +e
      npm run test:browser
      test_status=$?
      set -e
      tar -czf .build/browser-evidence.tar.gz -C .build evidence
      bash tools/ci/package-artifact.sh upload "$BROWSER_EVIDENCE_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}-${CI_JOB_ID}" .build/browser-evidence.tar.gz
      exit "$test_status"

browser:
  extends: .browser-base

.deploy-base:
  interruptible: false
  cache: *dependency-cache
  needs:
    - job: build
      artifacts: false
    - job: browser
      artifacts: false
  before_script:
    - *node-bootstrap
    - npm ci
    - mkdir -p .build
    - bash tools/ci/package-artifact.sh download "$RELEASE_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}" .build/release.tar.gz
    - tar -xzf .build/release.tar.gz

staging:
  extends: .deploy-base
  stage: deploy-staging
  resource_group: astro-blog-staging
  variables:
    DEPLOY_REF: "$CI_COMMIT_REF_NAME"
  script:
    - bash tools/ci/verify-deploy-freshness.sh
    - npm run cf:dry-run -- --env staging
    - npm run cf:deploy:staging 2>&1 | tee .build/evidence/wrangler-staging.log
    - npm run http:sweep -- --base https://blog-staging.seso.icu --output .build/evidence/staging-http-sweep.json
    - npx playwright install chromium
    - PLAYWRIGHT_BASE_URL=https://blog-staging.seso.icu npm run test:staging
    - npm run performance:collect -- --url https://blog-staging.seso.icu --label staging
  after_script:
    - |
      if [[ -d .build/evidence ]]; then
        tar -czf .build/staging-evidence.tar.gz -C .build evidence
        bash tools/ci/package-artifact.sh upload "$STAGING_EVIDENCE_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}-${CI_JOB_ID}" .build/staging-evidence.tar.gz
      fi
  environment:
    name: staging
    url: https://blog-staging.seso.icu
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

production:
  extends: .deploy-base
  stage: deploy-production
  resource_group: astro-blog-production
  needs:
    - job: staging
      artifacts: false
  script:
    - npm run cf:dry-run -- --env production
    - npm run cf:deploy:production 2>&1 | tee .build/evidence/wrangler-production.log
    - npm run http:sweep -- --base https://blog.seso.icu --output .build/evidence/production-http-sweep.json
    - npm run performance:collect -- --url https://blog.seso.icu --label production
  after_script:
    - |
      if [[ -d .build/evidence ]]; then
        tar -czf .build/production-evidence.tar.gz -C .build evidence
        bash tools/ci/package-artifact.sh upload "$PRODUCTION_EVIDENCE_PACKAGE_NAME" "${CI_PIPELINE_ID}-${CI_COMMIT_SHA}-${CI_JOB_ID}" .build/production-evidence.tar.gz
      fi
  environment:
    name: production
    url: https://blog.seso.icu
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
