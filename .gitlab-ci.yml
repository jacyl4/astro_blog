stages:
  - prepare
  - verify
  - build
  - browser
  - deploy-staging
  - deploy-production

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

default:
  image: node:24-bookworm
  interruptible: true
  before_script:
    - &node-bootstrap |
      if ! command -v npm >/dev/null 2>&1; then
        NODE_HOME="$CI_PROJECT_DIR/.ci-tools/node-v${NODE_VERSION}-linux-x64"
        if [[ ! -x "$NODE_HOME/bin/node" ]]; then
          mkdir -p "$CI_PROJECT_DIR/.ci-tools"
          curl --fail --silent --show-error --location \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            --output "$CI_PROJECT_DIR/.ci-tools/node.tar.xz"
          tar -xJf "$CI_PROJECT_DIR/.ci-tools/node.tar.xz" \
            -C "$CI_PROJECT_DIR/.ci-tools"
        fi
        export PATH="$NODE_HOME/bin:$PATH"
      fi
      node --version
      npm --version

variables:
  NODE_VERSION: "24.15.0"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  CONTENT_WORKTREE: "$CI_PROJECT_DIR/.work/content-source"

cache:
  &dependency-cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .ci-tools/
  policy: pull

prepare-content:
  stage: prepare
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - .npm/
        - .ci-tools/
      policy: pull-push
    - key: "content-$CI_PIPELINE_ID"
      paths:
        - .build/content/
        - .build/content-manifest.json
        - .build/diagnostics/
        - .build/evidence/content-head.txt
      policy: push
  script:
    - npm ci
    - bash tools/ci/prepare-content.sh

verify:
  stage: verify
  cache:
    - *dependency-cache
    - key: "content-$CI_PIPELINE_ID"
      paths:
        - .build/content/
        - .build/content-manifest.json
        - .build/diagnostics/
        - .build/evidence/content-head.txt
      policy: pull
  needs:
    - job: prepare-content
      artifacts: false
  script:
    - npm ci
    - mkdir -p .build/evidence
    - npm audit --audit-level=critical --json > .build/evidence/npm-audit.json
    - npx astro check
    - npm run test:unit
    - npm run boundaries:verify
    - npm run comments:verify-removed
    - npm run cloudflare:verify-static
    - npm run cf:types:check
    - npm run openspec:validate

build:
  stage: build
  cache:
    - *dependency-cache
    - key: "content-$CI_PIPELINE_ID"
      paths:
        - .build/content/
        - .build/content-manifest.json
        - .build/diagnostics/
        - .build/evidence/content-head.txt
      policy: pull
    - key: "release-$CI_PIPELINE_ID"
      paths:
        - dist/
        - .build/
      policy: push
  needs:
    - job: prepare-content
      artifacts: false
    - job: verify
      artifacts: false
  script:
    - npm ci
    - npm run build:prepared
    - npm run routes:verify
    - npm run html-baseline:verify
    - npm run smoke:static
    - npm run assets:verify
    - npm run comments:verify-removed
    - npm run routes:generate
    - npm run assets:generate
    - APP_SHA="$CI_COMMIT_SHA" npm run manifest:build

.browser-base:
  stage: browser
  cache:
    - *dependency-cache
    - key: "release-$CI_PIPELINE_ID"
      paths:
        - dist/
        - .build/
      policy: pull
  needs:
    - job: build
      artifacts: false
  script:
    - npm ci
    - npx playwright install chromium
    - npm run test:browser

browser:
  extends: .browser-base

.deploy-base:
  interruptible: false
  cache:
    - *dependency-cache
    - key: "release-$CI_PIPELINE_ID"
      paths:
        - dist/
        - .build/
      policy: pull
  needs:
    - job: build
      artifacts: false
    - job: browser
      artifacts: false
  before_script:
    - *node-bootstrap
    - npm ci

staging:
  extends: .deploy-base
  stage: deploy-staging
  script:
    - npm run cf:dry-run -- --env staging
    - npm run cf:deploy:staging 2>&1 | tee .build/evidence/wrangler-staging.log
    - npm run http:sweep -- --base https://blog-staging.seso.icu --output .build/evidence/staging-http-sweep.json
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

production:
  extends: .deploy-base
  stage: deploy-production
  resource_group: astro-blog-production
  script:
    - npm run cf:dry-run -- --env production
    - npm run cf:deploy:production 2>&1 | tee .build/evidence/wrangler-production.log
    - npm run http:sweep -- --base https://blog.seso.icu --output .build/evidence/production-http-sweep.json
  environment:
    name: production
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
